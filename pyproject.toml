[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "llm4security"
version = "0.1.0"
description = "EDA-grounded multi-agent LLM orchestration for hardware security research"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "redis>=5.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
]

[project.scripts]
guide-eda-mcp = "guide_mcp.eda_server.server:main"
llm4security-inference-smoke = "integrations.inference.smoke:main"
llm4security-eda-loop = "runner.eda_loop:main"

[project.optional-dependencies]
eda = ["mcp>=1.26,<2", "jsonschema>=4.23"]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13"]

[tool.hatch.build.targets.wheel]
packages = ["agents", "broker", "integrations", "guide_mcp", "runner", "schemas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
