# Run from the repository root with --env-file .env.
services:
  inference:
    restart: unless-stopped
    image: ${VLLM_IMAGE:?Set a ROCm gfx1201 vLLM image tag or digest verified for Qwen3.8}
    entrypoint: ["python3", "/app/integrations/inference/serve.py"]
    environment:
      HIP_VISIBLE_DEVICES: "0"
      VLLM_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
      VLLM_MODEL: ${VLLM_MODEL:-amd/Qwen3.8-27B-Quark-AWQ-INT4-W4A16}
      VLLM_MODEL_REVISION: ${VLLM_MODEL_REVISION:?Pin the checkpoint commit SHA}
      LLM_MODEL: ${LLM_MODEL:-Qwen3.8-27B}
      VLLM_MAX_MODEL_LEN: ${VLLM_MAX_MODEL_LEN:-65536}
      VLLM_MAX_NUM_SEQS: ${VLLM_MAX_NUM_SEQS:-1}
      VLLM_GPU_MEMORY_UTILIZATION: ${VLLM_GPU_MEMORY_UTILIZATION:-0.85}
      VLLM_TOOL_PARSER: ${VLLM_TOOL_PARSER:-qwen3_xml}
      VLLM_REASONING_PARSER: ${VLLM_REASONING_PARSER:-qwen3}
    devices: ["/dev/kfd:/dev/kfd", "/dev/dri:/dev/dri"]
    group_add: ["${VIDEO_GID:?Set guest video group ID}", "${RENDER_GID:?Set guest render group ID}"]
    ports: ["${INFERENCE_BIND:-127.0.0.1}:8000:8000"]
    shm_size: 8gb
    mem_limit: 48g
    cpus: 12
    volumes:
      - ../../integrations/inference/serve.py:/app/integrations/inference/serve.py:ro
      - model_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20m
      retries: 5
volumes:
  model_cache:
